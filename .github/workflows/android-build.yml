name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Android SDK information
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Show project structure
        run: |
          ls -la
          ls -la app
          cat app/build.gradle.kts

      - name: Show Gradle projects
        run: ./gradlew projects --info

      - name: Show app tasks
        run: ./gradlew :app:tasks --all --info